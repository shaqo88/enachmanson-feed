name: Validate Published Podcast Feed

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - 'assets/**'
      - 'feed.xml'
      - 'feed-standard.xml'
      - 'requirements.txt'
      - 'yt/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.0.2
        with:
          python-version: '3.12'
          cache: pip

      - name: Install pinned Python dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Validate generated feeds
        run: python yt/validate_feed.py

      - name: Validate published feed, artwork, and audio ranges
        run: |
          for attempt in {1..18}; do
            python yt/validate_feed.py --network && exit 0
            echo "Public validation attempt $attempt failed; retrying in 10 seconds."
            sleep 10
          done
          exit 1
