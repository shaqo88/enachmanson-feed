name: Rebuild Feeds Only

# Manual only — rebuild from episodes.json without touching YouTube or R2.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.0.2
        with:
          python-version: '3.12'
          cache: pip

      - name: Install pinned Python dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Build feeds
        run: python yt/build_feeds.py

      - name: Validate generated feeds
        run: python yt/validate_feed.py

      - name: Commit updated feeds
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add feed.xml feed-standard.xml
          git diff --staged --quiet || git commit -m "🔄 Rebuild feeds from episodes.json"
          git push

      - name: Validate public artwork and audio ranges
        run: |
          for attempt in {1..12}; do
            python yt/validate_feed.py --network && exit 0
            echo "Public validation attempt $attempt failed; retrying in 10 seconds."
            sleep 10
          done
          exit 1
