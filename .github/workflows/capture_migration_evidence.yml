name: Capture Migration Evidence

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/capture_migration_evidence.yml'
      - 'yt/capture_migration_evidence.py'
  schedule:
    - cron: '37 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.0.2
        with:
          python-version: '3.12'
          cache: pip

      - name: Install pinned Python dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Capture feeds, artwork, GUID comparison, and Apple discovery
        run: python yt/capture_migration_evidence.py --output-dir migration-evidence

      - name: Upload migration evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: migration-evidence-${{ github.run_id }}
          path: migration-evidence/
          if-no-files-found: error
          retention-days: 90
