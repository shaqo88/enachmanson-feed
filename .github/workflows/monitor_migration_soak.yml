name: Monitor Migration Soak

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/monitor_migration_soak.yml'
      - 'yt/soak_status.py'
  workflow_run:
    workflows:
      - Sync Episodes from YouTube
    types:
      - completed
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.0.2
        with:
          python-version: '3.12'
          cache: pip

      - name: Install pinned Python dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Audit soak health
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python yt/soak_status.py \
            --json-output soak-status.json \
            --summary-output "$GITHUB_STEP_SUMMARY" \
            --fail-on-unhealthy

      - name: Upload soak status
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: migration-soak-status-${{ github.run_id }}
          path: soak-status.json
          if-no-files-found: warn
          retention-days: 30
